<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Site</title>
  <style>
    :root {
      --mint:       #B8E8D8;   /* mellow mint background */
      --mint-soft:  #CFEFE3;   /* lighter mint for cards */
      --pink:       #E8A9BE;   /* mellow pink frame */
      --pink-deep:  #D98AA6;   /* slightly deeper pink for hover/active */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--pink);
      min-height: 100vh;
    }

    body {
      font-family: Arial, sans-serif;
      color: var(--mint);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* OUTER PINK FRAME */
    .page-frame {
      width: 100%;
      max-width: 1100px;
      min-height: 100vh;
      background: var(--pink);
      padding: 14px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* INNER MINT AREA */
    .page-inner {
      background: var(--mint);
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
    }

    /* Decorative question marks scattered on mint background */
    .qmark {
      position: absolute;
      color: var(--pink);
      opacity: 0.4;
      font-weight: 800;
      font-family: 'Comic Sans MS', 'Marker Felt', cursive, Arial, sans-serif;
      pointer-events: none;
      user-select: none;
      z-index: 0;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
      animation: float-q ease-in-out infinite;
      display: inline-block;
    }

    @keyframes float-q {
      0%   { transform: translateY(0px)   rotate(var(--rot, 0deg)) scale(1); }
      25%  { transform: translateY(-10px) rotate(var(--rot, 0deg)) scale(1.15, 0.85); }
      50%  { transform: translateY(2px)   rotate(var(--rot, 0deg)) scale(0.9, 1.12); }
      75%  { transform: translateY(-6px)  rotate(var(--rot, 0deg)) scale(1.08, 0.92); }
      100% { transform: translateY(0px)   rotate(var(--rot, 0deg)) scale(1); }
    }

    /* BARS */
    .bar {
      height: 54px;
      background: var(--pink);
      display: flex;
      align-items: center;
      padding: 0 20px;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }
    .bar-top { justify-content: center; }
    .bar-bottom { justify-content: space-between; }

    .site-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--mint);
      letter-spacing: 2px;
    }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 24px;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    /* FOLDER GRID */
    #grid-view { width: 100%; max-width: 900px; margin: 0 auto; }

    .folder-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
      width: 100%;
    }
    @media (max-width: 700px) {
      .folder-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .folder-card {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border: 2px solid var(--pink);
      background: var(--mint-soft);
      overflow: hidden;
      border-radius: 6px;
      transition: border-color 0.15s, transform 0.15s;
      width: 100%;
    }
    .folder-card:hover {
      border-color: var(--pink-deep);
      transform: translateY(-3px);
    }

    .folder-thumb {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.3);
    }
    .folder-thumb-empty {
      width: 100%;
      aspect-ratio: 1;
      background: rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--pink);
      font-size: 2rem;
      opacity: 0.6;
    }

    .folder-name {
      padding: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--pink-deep);
      text-align: center;
      letter-spacing: 1px;
      background: var(--mint-soft);
    }

    /* FOLDER PHOTO VIEW */
    #folder-view { display: none; width: 100%; max-width: 900px; }

    .folder-nav {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .folder-view-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--pink-deep);
      letter-spacing: 1px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 600px) {
      .photo-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .photo-card {
      cursor: pointer;
      border: 2px solid var(--pink);
      overflow: hidden;
      aspect-ratio: 3/4;
      background: var(--mint-soft);
      border-radius: 6px;
      transition: border-color 0.15s, transform 0.15s;
    }
    .photo-card:hover {
      border-color: var(--pink-deep);
      transform: translateY(-3px);
    }
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .empty-msg {
      color: var(--pink-deep);
      opacity: 0.7;
      padding: 40px 0;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    /* BUTTONS */
    .btn {
      background: none;
      border: 2px solid var(--mint);
      color: var(--mint);
      cursor: pointer;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 4px;
    }
    .btn:hover { background: var(--mint); color: var(--pink-deep); }

    /* ARROW BUTTONS (mint) */
    .arrow-btn {
      background: none;
      border: 2px solid var(--mint);
      color: var(--mint);
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 4px;
    }
    .arrow-btn:hover:not(:disabled) { background: var(--mint); color: var(--pink-deep); }
    .arrow-btn:disabled { opacity: 0.3; cursor: default; }
    .arrow-btn svg { width: 18px; height: 18px; }

    .page-label {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--mint);
      letter-spacing: 1px;
    }

    /* LIGHTBOX */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #lightbox.open { display: flex; }

    .lb-img-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      overflow: hidden;
    }
    #lb-img {
      max-width: 100%;
      max-height: calc(100vh - 120px);
      object-fit: contain;
      display: block;
      border-radius: 4px;
    }

    .lb-bar {
      height: 54px;
      background: var(--pink);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      flex-shrink: 0;
    }

    .lb-counter {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--mint);
      letter-spacing: 1px;
      min-width: 60px;
      text-align: center;
    }

    .lb-close {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: 2px solid var(--mint);
      color: var(--mint);
      cursor: pointer;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      z-index: 101;
      border-radius: 4px;
    }
    .lb-close:hover { background: var(--mint); color: var(--pink-deep); }
  </style>
</head>
<body>

<div class="page-frame">
  <div class="bar bar-top">
    <span class="site-title">MY SITE</span>
  </div>

  <div class="page-inner" id="page-inner">
    <!-- decorative question marks injected by JS -->

    <main class="main">

      <!-- FOLDER GRID -->
      <div id="grid-view">
        <div class="folder-grid" id="folder-grid"></div>
      </div>

      <!-- PHOTOS INSIDE A FOLDER -->
      <div id="folder-view">
        <div class="folder-nav">
          <button class="btn" id="back-btn">← Back</button>
          <span class="folder-view-title" id="folder-view-title"></span>
        </div>
        <div class="photo-grid" id="photo-grid"></div>
      </div>

    </main>
  </div>

  <div class="bar bar-bottom">
    <button class="arrow-btn" id="prev-btn" aria-label="Previous page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="page-label" id="page-label">1 / 1</span>
    <button class="arrow-btn" id="next-btn" aria-label="Next page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button class="lb-close" id="lb-close">✕ Close</button>
  <div class="lb-img-wrap">
    <img id="lb-img" src="" alt="" />
  </div>
  <div class="lb-bar">
    <button class="arrow-btn" id="lb-prev" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="lb-counter" id="lb-counter">1 / 1</span>
    <button class="arrow-btn" id="lb-next" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
</div>

<script>
  const PER_PAGE = 4;
  let folders = [];
  let page = 0;
  let activeFolder = null;
  let lbIndex = 0;

  const gridView       = document.getElementById('grid-view');
  const folderView     = document.getElementById('folder-view');
  const folderGrid     = document.getElementById('folder-grid');
  const photoGrid      = document.getElementById('photo-grid');
  const folderViewTitle= document.getElementById('folder-view-title');
  const pageLabel      = document.getElementById('page-label');
  const prevBtn        = document.getElementById('prev-btn');
  const nextBtn        = document.getElementById('next-btn');
  const backBtn        = document.getElementById('back-btn');
  const lightbox       = document.getElementById('lightbox');
  const lbImg          = document.getElementById('lb-img');
  const lbCounter      = document.getElementById('lb-counter');
  const lbPrev         = document.getElementById('lb-prev');
  const lbNext         = document.getElementById('lb-next');
  const lbClose        = document.getElementById('lb-close');
  const pageInner      = document.getElementById('page-inner');

  // Scatter decorative pink question marks across the mint background
  // Runs fresh on every page load, so placement is different every time
  function addQuestionMarks() {
    const count = 45;
    for (let i = 0; i < count; i++) {
      const q = document.createElement('span');
      q.className = 'qmark';
      q.textContent = '?';
      q.style.left = Math.random() * 95 + '%';
      q.style.top = Math.random() * 95 + '%';
      q.style.fontSize = (1 + Math.random() * 2) + 'rem';
      const rot = Math.random() * 50 - 25;
      q.style.setProperty('--rot', rot + 'deg');
      q.style.animationDelay = (Math.random() * 4) + 's';
      q.style.animationDuration = (1.8 + Math.random() * 1.8) + 's';
      pageInner.appendChild(q);
    }
  }

  async function init() {
    try {
      const r = await fetch('data.json?t=' + Date.now());
      const d = await r.json();
      folders = d.folders || [];
    } catch(e) { folders = []; }
    addQuestionMarks();
    renderGrid();
  }

  function totalPages() { return Math.max(1, Math.ceil(folders.length / PER_PAGE)); }

  function renderGrid() {
    const tp = totalPages();
    page = Math.min(page, tp - 1);
    const slice = folders.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);

    folderGrid.innerHTML = '';
    slice.forEach((f, i) => {
      const card = document.createElement('div');
      card.className = 'folder-card';
      card.tabIndex = 0;

      if (f.thumbnail) {
        card.innerHTML = `<img class="folder-thumb" src="${f.thumbnail}" alt="${f.title}" loading="lazy">
                          <div class="folder-name">${f.title}</div>`;
      } else {
        card.innerHTML = `<div class="folder-thumb-empty">?</div>
                          <div class="folder-name">${f.title}</div>`;
      }

      const idx = page * PER_PAGE + i;
      card.addEventListener('click', () => openFolder(idx));
      card.addEventListener('keydown', e => { if (e.key === 'Enter') openFolder(idx); });
      folderGrid.appendChild(card);
    });

    pageLabel.textContent = `${page + 1} / ${tp}`;
    prevBtn.disabled = page === 0;
    nextBtn.disabled = page >= tp - 1;
  }

  function openFolder(idx) {
    activeFolder = folders[idx];
    folderViewTitle.textContent = activeFolder.title;
    photoGrid.innerHTML = '';

    if (!activeFolder.photos || activeFolder.photos.length === 0) {
      photoGrid.innerHTML = '<div class="empty-msg">No photos yet. Add them to data.json.</div>';
    } else {
      activeFolder.photos.forEach((src, i) => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.tabIndex = 0;
        const img = document.createElement('img');
        img.src = src;
        img.alt = `Photo ${i + 1}`;
        img.loading = 'lazy';
        card.appendChild(img);
        card.addEventListener('click', () => openLightbox(i));
        card.addEventListener('keydown', e => { if (e.key === 'Enter') openLightbox(i); });
        photoGrid.appendChild(card);
      });
    }

    gridView.style.display = 'none';
    folderView.style.display = 'block';
    prevBtn.style.visibility = 'hidden';
    nextBtn.style.visibility = 'hidden';
    pageLabel.style.visibility = 'hidden';
  }

  backBtn.addEventListener('click', () => {
    folderView.style.display = 'none';
    gridView.style.display = 'block';
    prevBtn.style.visibility = '';
    nextBtn.style.visibility = '';
    pageLabel.style.visibility = '';
  });

  prevBtn.addEventListener('click', () => { if (page > 0) { page--; renderGrid(); } });
  nextBtn.addEventListener('click', () => { if (page < totalPages() - 1) { page++; renderGrid(); } });

  function openLightbox(i) {
    lbIndex = i;
    updateLb();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function updateLb() {
    const photos = activeFolder.photos;
    lbImg.src = photos[lbIndex];
    lbCounter.textContent = `${lbIndex + 1} / ${photos.length}`;
    lbPrev.disabled = lbIndex === 0;
    lbNext.disabled = lbIndex === photos.length - 1;
  }

  function closeLb() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  lbPrev.addEventListener('click', () => { if (lbIndex > 0) { lbIndex--; updateLb(); } });
  lbNext.addEventListener('click', () => { if (lbIndex < activeFolder.photos.length - 1) { lbIndex++; updateLb(); } });
  lbClose.addEventListener('click', closeLb);
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLb(); });

  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'ArrowLeft' && lbIndex > 0) { lbIndex--; updateLb(); }
    if (e.key === 'ArrowRight' && lbIndex < activeFolder.photos.length - 1) { lbIndex++; updateLb(); }
    if (e.key === 'Escape') closeLb();
  });

  init();
</script>
</body>
</html>
