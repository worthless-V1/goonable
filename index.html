<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>
  <style>
    :root {
      --mint:      #b2e8d0;
      --pink:      #f2a7b8;
      --mint-dark: #6ec9a0;
      --pink-dark: #d9607a;
      --border:    52px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; overflow-x: hidden; }

    body {
      background: var(--mint);
      font-family: 'Segoe UI', system-ui, sans-serif;
      position: relative;
    }

    /* ── BORDER FRAME — z-index 200 so content sits below it,
       canvas sits above it ── */
    #border-frame {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 200;
    }
    #border-frame .b-top,
    #border-frame .b-bottom,
    #border-frame .b-left,
    #border-frame .b-right {
      position: absolute;
      background: var(--pink);
    }
    #border-frame .b-top    { top:0;    left:0; right:0;  height: var(--border); }
    #border-frame .b-bottom { bottom:0; left:0; right:0;  height: var(--border); }
    #border-frame .b-left   { top:0; bottom:0; left:0;    width:  var(--border); }
    #border-frame .b-right  { top:0; bottom:0; right:0;   width:  var(--border); }

    /* ── ICON BOX — centred on the TOP border band
       Box is 44×44. Border band is 52px tall.
       To be fully inside the band: top must be ≥0, bottom ≤ 52px.
       Centre of band = 26px from top.
       Box top = 26 - 22 = 4px  ✓  Box bottom = 4 + 44 = 48px ≤ 52px ✓
       Horizontally centred: left: 50%; transform: translateX(-50%)        ── */
    #icon-box {
      position: fixed;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width:  44px;
      height: 44px;
      background: var(--pink);
      border: 3px solid var(--mint);
      border-radius: 6px;
      z-index: 400;   /* above border frame, below canvas */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: auto;
    }
    #icon-box img { width:100%; height:100%; object-fit:contain; }

    /* ── CANVAS — z-index 150 = above border (200)...
       Wait: border is 200, canvas must be ABOVE border to show on it.
       But canvas must be BELOW folder cards so ?s don't cover UI.
       Solution: canvas z-index 250 (above border 200),
       folder cards & photos get z-index 260 via their container,
       icon-box stays at 400.                                      ── */
    #qcanvas {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 250;
    }

    /* ── APP CONTENT — z-index 260, above canvas (250) ── */
    #app {
      position: relative;
      z-index: 260;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      /* safe zone: border=52px, add 24px extra breathing room each side */
      padding-top:    calc(var(--border) + 24px);
      padding-bottom: calc(var(--border) + 80px);
      padding-left:   calc(var(--border) + 24px);
      padding-right:  calc(var(--border) + 24px);
    }

    .view { display: none; }
    .view.active { display: flex; flex-direction: column; flex: 1; }

    /* ── FOLDER GRID ── */
    #folders-view { align-items: center; justify-content: center; }
    #folder-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      /* calc: total width minus 2 borders (52px each) minus 2×28px breathing room */
      width: calc(100vw - 2 * var(--border) - 56px);
      max-width: 420px;
      margin: auto;
    }
    .folder-card {
      background: var(--mint);
      border: none;
      border-radius: 16px;
      cursor: pointer; overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      aspect-ratio: 1/1;
      transition: transform .18s, box-shadow .18s;
      box-shadow: 0 4px 16px rgba(0,0,0,.09);
    }
    .folder-card:hover  { transform: translateY(-4px) scale(1.03); box-shadow: 0 10px 26px rgba(0,0,0,.15); }
    .folder-card:active { transform: scale(.97); }
    .folder-thumb       { width:100%; flex:1; object-fit:cover; display:block; }
    .folder-thumb-placeholder {
      width:100%; flex:1;
      display:flex; align-items:center; justify-content:center;
      background: var(--mint); font-size:46px;
    }
    .folder-title {
      width:100%; padding:8px 10px; text-align:center;
      font-size:.85rem; font-weight:800; color:var(--mint-dark);
      background:var(--pink);
      letter-spacing:.05em; text-transform:uppercase;
    }

    /* ── PHOTOS GRID ── */
    #photos-view { align-items: center; }
    #photos-header {
      display:flex; align-items:center; gap:14px;
      width: calc(100vw - 2 * var(--border) - 56px);
      max-width: 420px;
      margin-bottom:18px;
    }
    .back-btn {
      background:none; border:3px solid var(--mint-dark); border-radius:50px;
      color:var(--mint-dark); font-weight:800; font-size:.88rem;
      padding:6px 18px; cursor:pointer;
      transition:background .14s,color .14s; white-space:nowrap;
    }
    .back-btn:hover { background:var(--mint-dark); color:#fff; }
    #photos-folder-title {
      font-size:1.25rem; font-weight:800; color:var(--pink-dark);
      letter-spacing:.05em; text-transform:uppercase;
    }
    #photo-grid {
      display:grid; grid-template-columns:repeat(3,1fr);
      gap:12px;
      width: calc(100vw - 2 * var(--border) - 56px);
      max-width: 420px;
      margin:0 auto;
    }
    .photo-thumb {
      aspect-ratio:1/1; object-fit:cover; border-radius:12px;
      border:3px solid var(--pink); cursor:pointer;
      width:100%; display:block; background:var(--pink);
      transition:transform .14s,box-shadow .14s;
    }
    .photo-thumb:hover  { transform:scale(1.06); box-shadow:0 6px 18px rgba(0,0,0,.18); }
    .photo-thumb:active { transform:scale(.97); }
    #photos-pagination  { margin-top:26px; }

    /* ── PAGINATION ── */
    .pagination { display:flex; align-items:center; gap:20px; justify-content:center; }
    .pg-arrow {
      background:none; border:none; cursor:pointer;
      font-size:2rem; color:var(--mint-dark); font-weight:900; line-height:1;
      padding:4px 14px; border-radius:50%;
      transition:background .14s,transform .14s; user-select:none;
    }
    .pg-arrow:hover    { background:rgba(110,201,160,.25); transform:scale(1.2); }
    .pg-arrow:disabled { opacity:.28; cursor:default; transform:none !important; background:none !important; }
    .pg-label { font-size:.95rem; font-weight:800; color:var(--mint-dark); min-width:70px; text-align:center; }

    #folders-pagination {
      position:fixed;
      bottom:calc(var(--border) + 10px);
      left:50%; transform:translateX(-50%);
      z-index:20;
    }

    /* ── FULLSCREEN ── */
    #fullscreen-view {
      position:fixed; inset:0;
      background:rgba(178,232,208,.97);
      z-index:800; display:none;
      flex-direction:column; align-items:center; justify-content:center;
      padding:28px;
    }
    #fullscreen-view.active { display:flex; }
    #fs-topbar {
      position:absolute; top:16px; left:20px; right:20px;
      display:flex; justify-content:space-between; align-items:center;
    }
    #fs-back-to-folder {
      background:var(--pink); border:3px solid var(--mint-dark); border-radius:50px;
      padding:6px 18px; font-size:.88rem; font-weight:800;
      color:var(--mint-dark); cursor:pointer;
      transition:background .14s,color .14s;
    }
    #fs-back-to-folder:hover { background:var(--mint-dark); color:#fff; }
    #fs-close {
      background:var(--pink); border:3px solid var(--mint-dark); border-radius:50%;
      width:44px; height:44px; font-size:1.3rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      color:var(--mint-dark); font-weight:900;
      transition:background .14s,transform .14s;
    }
    #fs-close:hover { background:var(--mint-dark); color:#fff; transform:scale(1.1); }
    #fs-img {
      max-width:88vw; max-height:72vh; object-fit:contain;
      border-radius:16px; border:5px solid var(--pink);
      box-shadow:0 8px 36px rgba(0,0,0,.22);
    }
    #fs-controls { display:flex; align-items:center; gap:28px; margin-top:20px; }
    #fs-counter  { font-size:.95rem; font-weight:800; color:var(--pink-dark); min-width:70px; text-align:center; }

    .empty-msg { color:var(--pink-dark); font-weight:700; font-size:1rem; text-align:center; margin:40px auto; opacity:.75; }

    @media (max-width:500px) {
      #app {
        padding-top:    calc(var(--border) + 20px);
        padding-bottom: calc(var(--border) + 70px);
        padding-left:   calc(var(--border) + 16px);
        padding-right:  calc(var(--border) + 16px);
      }
      #folder-grid {
        width: calc(100vw - 2 * var(--border) - 32px);
        gap: 12px;
      }
      #photo-grid {
        grid-template-columns: repeat(2,1fr);
        width: calc(100vw - 2 * var(--border) - 32px);
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Pink border -->
  <div id="border-frame">
    <div class="b-top"></div>
    <div class="b-bottom"></div>
    <div class="b-left"></div>
    <div class="b-right"></div>
  </div>

  <!-- Icon box: top-centre, fully inside border band, above canvas -->
  <div id="icon-box"></div>

  <!-- Canvas: above border, below icon box -->
  <canvas id="qcanvas"></canvas>

  <div id="app">
    <div id="folders-view" class="view active">
      <div id="folder-grid"></div>
    </div>
    <div id="photos-view" class="view">
      <div id="photos-header">
        <button class="back-btn" id="photos-back-btn">← Back</button>
        <div id="photos-folder-title"></div>
      </div>
      <div id="photo-grid"></div>
      <div class="pagination" id="photos-pagination">
        <button class="pg-arrow" id="photos-prev">&#8592;</button>
        <span class="pg-label" id="photos-page-label"></span>
        <button class="pg-arrow" id="photos-next">&#8594;</button>
      </div>
    </div>
  </div>

  <div class="pagination" id="folders-pagination">
    <button class="pg-arrow" id="folders-prev">&#8592;</button>
    <span class="pg-label" id="folders-page-label"></span>
    <button class="pg-arrow" id="folders-next">&#8594;</button>
  </div>

  <div id="fullscreen-view">
    <div id="fs-topbar">
      <button id="fs-back-to-folder">← Folder</button>
      <button id="fs-close">✕</button>
    </div>
    <img id="fs-img" src="" alt="Full view" />
    <div id="fs-controls">
      <button class="pg-arrow" id="fs-prev">&#8592;</button>
      <span id="fs-counter"></span>
      <button class="pg-arrow" id="fs-next">&#8594;</button>
    </div>
  </div>

<script>
/* ══════════════════════════════════════
   CONFIG
══════════════════════════════════════ */
const MINT_COLOR = '#f2a7b8';   // color of ? when on MINT background = PINK
const PINK_COLOR = '#b2e8d0';   // color of ? when on PINK border     = MINT
const BORDER_PX  = 52;
const FOLDERS_PER_PAGE = 4;
const PHOTOS_PER_PAGE  = 9;

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
let data            = null;
let currentView     = 'folders';
let foldersPage     = 0;
let photosPage      = 0;
let activeFolderIdx = null;
let fsPhotoIdx      = null;

/* ══════════════════════════════════════
   FLOATING ? MARKS  (canvas-drawn)
   — The "?" character itself changes color.
   — No bubble/circle background at all.
   — Gummy look = thick, rounded, drop-shadow font styling.
══════════════════════════════════════ */
const canvas = document.getElementById('qcanvas');
const ctx    = canvas.getContext('2d');

let qmarks = [];

function rnd(a, b) { return a + Math.random() * (b - a); }

function initQmarks() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  qmarks = [];
  for (let i = 0; i < 45; i++) {
    qmarks.push({
      x:     rnd(0, canvas.width),
      y:     rnd(0, canvas.height),
      size:  rnd(24, 48),
      vx:    rnd(-0.4, 0.4),
      vy:    rnd(-0.4, 0.4),
      phase: rnd(0, Math.PI * 2),
      speed: rnd(0.013, 0.03),
      bobAmp:rnd(7, 18),
      rot:   rnd(-0.25, 0.25),
      rotV:  rnd(-0.007, 0.007),
    });
  }
}

function drawQ(x, y, size, color, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);

  const fs = size;
  ctx.font = `900 ${fs}px "Arial Rounded MT Bold", "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';

  /* Gummy effect: thick outer glow / soft shadow, then fill */
  ctx.shadowColor  = color;
  ctx.shadowBlur   = fs * 0.55;
  ctx.fillStyle    = color;
  ctx.fillText('?', 0, 0);

  /* Second pass: sharper inner fill, slightly lighter for depth */
  ctx.shadowBlur   = fs * 0.18;
  ctx.shadowColor  = 'rgba(255,255,255,0.55)';
  ctx.fillStyle    = color;
  ctx.fillText('?', 0, 0);

  ctx.restore();
}

function tickQmarks() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Collect all rects we must never draw over
  const skipEls = [
    ...document.querySelectorAll('.folder-card'),
    ...document.querySelectorAll('.photo-thumb'),
    ...document.querySelectorAll('.back-btn'),
    ...document.querySelectorAll('.pg-arrow'),
    document.getElementById('icon-box'),
    document.getElementById('photos-folder-title'),
  ].filter(Boolean);
  const skipRects = skipEls.map(el => el.getBoundingClientRect());

  const pad = 10;

  for (const q of qmarks) {
    q.phase += q.speed;
    q.rot   += q.rotV;
    q.x     += q.vx;
    q.y     += q.vy;

    // wrap
    if (q.x < -60)  q.x = W + 60;
    if (q.x > W+60) q.x = -60;
    if (q.y < -60)  q.y = H + 60;
    if (q.y > H+60) q.y = -60;

    const drawY = q.y + Math.sin(q.phase) * q.bobAmp;

    // Skip drawing if over any protected element
    let skip = false;
    for (const r of skipRects) {
      if (q.x > r.left - pad && q.x < r.right  + pad &&
          drawY > r.top - pad && drawY < r.bottom + pad) { skip = true; break; }
    }
    if (skip) continue;

    // Color: mint ? on pink border, pink ? on mint background
    const onBorder = q.x < BORDER_PX || q.x > W - BORDER_PX ||
                     drawY < BORDER_PX || drawY > H - BORDER_PX;
    const color = onBorder ? PINK_COLOR : MINT_COLOR;

    drawQ(q.x, drawY, q.size, color, q.rot);
  }

  requestAnimationFrame(tickQmarks);
}

window.addEventListener('resize', () => {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
});

/* ══════════════════════════════════════
   ICON BOX
══════════════════════════════════════ */
function renderIcon(src) {
  const box = document.getElementById('icon-box');
  box.innerHTML = src ? `<img src="${src}" alt="icon">` : '';
}

/* ══════════════════════════════════════
   VIEW SWITCHING
══════════════════════════════════════ */
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  if (name === 'folders' || name === 'photos')
    document.getElementById(name + '-view').classList.add('active');
  document.getElementById('fullscreen-view')
    .classList.toggle('active', name === 'fullscreen');
  document.getElementById('folders-pagination').style.display =
    name === 'folders' ? 'flex' : 'none';
  currentView = name;
}

/* ══════════════════════════════════════
   FOLDERS
══════════════════════════════════════ */
function renderFolders() {
  const grid  = document.getElementById('folder-grid');
  const label = document.getElementById('folders-page-label');
  const prevB = document.getElementById('folders-prev');
  const nextB = document.getElementById('folders-next');
  const total = Math.max(1, Math.ceil(data.folders.length / FOLDERS_PER_PAGE));
  const start = foldersPage * FOLDERS_PER_PAGE;

  label.textContent = `${foldersPage+1} / ${total}`;
  prevB.disabled = foldersPage === 0;
  nextB.disabled = foldersPage >= total - 1;

  grid.innerHTML = '';
  data.folders.slice(start, start + FOLDERS_PER_PAGE).forEach((f, i) => {
    const idx  = start + i;
    const card = document.createElement('div');
    card.className = 'folder-card';
    card.setAttribute('role','button'); card.setAttribute('tabindex','0');
    card.innerHTML = f.thumbnail
      ? `<img class="folder-thumb" src="${f.thumbnail}" alt="${f.title}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
         <div class="folder-thumb-placeholder" style="display:none">📁</div>
         <div class="folder-title">${f.title}</div>`
      : `<div class="folder-thumb-placeholder">📁</div>
         <div class="folder-title">${f.title}</div>`;
    const open = () => openFolder(idx);
    card.addEventListener('click', open);
    card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') open(); });
    grid.appendChild(card);
  });
}

document.getElementById('folders-prev').addEventListener('click', () => {
  if (foldersPage > 0) { foldersPage--; renderFolders(); }
});
document.getElementById('folders-next').addEventListener('click', () => {
  const max = Math.ceil(data.folders.length / FOLDERS_PER_PAGE) - 1;
  if (foldersPage < max) { foldersPage++; renderFolders(); }
});

/* ══════════════════════════════════════
   PHOTOS
══════════════════════════════════════ */
function openFolder(idx) {
  activeFolderIdx = idx; photosPage = 0;
  renderPhotos(); showView('photos');
}

function renderPhotos() {
  const folder = data.folders[activeFolderIdx];
  const photos = folder.photos || [];
  const total  = Math.max(1, Math.ceil(photos.length / PHOTOS_PER_PAGE));
  const start  = photosPage * PHOTOS_PER_PAGE;

  document.getElementById('photos-folder-title').textContent = folder.title;
  document.getElementById('photos-page-label').textContent   = `${photosPage+1} / ${total}`;
  document.getElementById('photos-prev').disabled = photosPage === 0;
  document.getElementById('photos-next').disabled = photosPage >= total - 1;
  document.getElementById('photos-pagination').style.visibility =
    total > 1 ? 'visible' : 'hidden';

  const grid = document.getElementById('photo-grid');
  grid.innerHTML = '';
  if (!photos.length) {
    grid.innerHTML = '<p class="empty-msg">No photos in this folder yet.</p>';
    return;
  }
  photos.slice(start, start + PHOTOS_PER_PAGE).forEach((src, i) => {
    const gIdx = start + i;
    const img  = document.createElement('img');
    img.className = 'photo-thumb';
    img.src = src; img.alt = `Photo ${gIdx+1}`; img.loading = 'lazy';
    img.addEventListener('click', () => openFullscreen(gIdx));
    grid.appendChild(img);
  });
}

document.getElementById('photos-prev').addEventListener('click', () => {
  if (photosPage > 0) { photosPage--; renderPhotos(); }
});
document.getElementById('photos-next').addEventListener('click', () => {
  const max = Math.ceil((data.folders[activeFolderIdx].photos||[]).length / PHOTOS_PER_PAGE) - 1;
  if (photosPage < max) { photosPage++; renderPhotos(); }
});
document.getElementById('photos-back-btn').addEventListener('click', () => {
  activeFolderIdx = null; showView('folders'); renderFolders();
});

/* ══════════════════════════════════════
   FULLSCREEN
══════════════════════════════════════ */
function openFullscreen(idx) {
  fsPhotoIdx = idx; renderFullscreen(); showView('fullscreen');
}
function renderFullscreen() {
  const photos = data.folders[activeFolderIdx].photos || [];
  document.getElementById('fs-img').src = photos[fsPhotoIdx];
  document.getElementById('fs-counter').textContent = `${fsPhotoIdx+1} / ${photos.length}`;
  document.getElementById('fs-prev').disabled = fsPhotoIdx === 0;
  document.getElementById('fs-next').disabled = fsPhotoIdx >= photos.length - 1;
}

document.getElementById('fs-prev').addEventListener('click', () => {
  if (fsPhotoIdx > 0) { fsPhotoIdx--; renderFullscreen(); }
});
document.getElementById('fs-next').addEventListener('click', () => {
  const photos = data.folders[activeFolderIdx].photos || [];
  if (fsPhotoIdx < photos.length - 1) { fsPhotoIdx++; renderFullscreen(); }
});
document.getElementById('fs-close').addEventListener('click', () => {
  photosPage = Math.floor(fsPhotoIdx / PHOTOS_PER_PAGE);
  renderPhotos(); showView('photos');
});
document.getElementById('fs-back-to-folder').addEventListener('click', () => {
  activeFolderIdx = null; fsPhotoIdx = null;
  showView('folders'); renderFolders();
});
document.addEventListener('keydown', e => {
  if (currentView !== 'fullscreen') return;
  if (e.key === 'ArrowLeft')  document.getElementById('fs-prev').click();
  if (e.key === 'ArrowRight') document.getElementById('fs-next').click();
  if (e.key === 'Escape')     document.getElementById('fs-close').click();
});

/* ══════════════════════════════════════
   BOOT
══════════════════════════════════════ */
async function boot() {
  initQmarks();
  requestAnimationFrame(tickQmarks);

  try {
    const res = await fetch('data.json');
    if (!res.ok) throw new Error();
    data = await res.json();
  } catch {
    data = {
      icon: '',
      folders: [
        { id:'f1', title:'Folder 1', thumbnail:'', photos:[] },
        { id:'f2', title:'Folder 2', thumbnail:'', photos:[] },
        { id:'f3', title:'Folder 3', thumbnail:'', photos:[] },
        { id:'f4', title:'Folder 4', thumbnail:'', photos:[] },
      ]
    };
  }

  renderIcon(data.icon || '');
  renderFolders();
  showView('folders');
}

boot();
</script>
</body>
</html>
