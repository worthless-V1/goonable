<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Site</title>
  <style>
    :root {
      --green: #39FF14;
      --pink:  #FF007F;
      --cyan:  #00FFFF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--green);
      font-family: Arial, sans-serif;
      color: var(--cyan);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* BARS */
    .bar {
      height: 52px;
      background: var(--pink);
      display: flex;
      align-items: center;
      padding: 0 20px;
      flex-shrink: 0;
    }
    .bar-top { justify-content: center; }
    .bar-bottom { justify-content: space-between; }

    .site-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--cyan);
      letter-spacing: 2px;
    }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px;
    }

    /* FOLDER GRID */
    #grid-view { width: 100%; max-width: 900px; }

    .folder-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 0;
    }
    @media (max-width: 600px) {
      .folder-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .folder-card {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border: 2px solid var(--cyan);
      background: rgba(0,0,0,0.15);
      overflow: hidden;
    }
    .folder-card:hover {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .folder-thumb {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: rgba(0,0,0,0.2);
    }
    .folder-thumb-empty {
      width: 100%;
      aspect-ratio: 1;
      background: rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      font-size: 2rem;
      opacity: 0.4;
    }

    .folder-name {
      padding: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--cyan);
      text-align: center;
      letter-spacing: 1px;
    }

    /* FOLDER PHOTO VIEW */
    #folder-view { display: none; width: 100%; max-width: 900px; }

    .folder-nav {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .folder-view-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--cyan);
      letter-spacing: 1px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    @media (max-width: 500px) {
      .photo-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .photo-card {
      cursor: pointer;
      border: 2px solid var(--cyan);
      overflow: hidden;
      aspect-ratio: 3/4;
      background: rgba(0,0,0,0.2);
    }
    .photo-card:hover { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .empty-msg {
      color: var(--cyan);
      opacity: 0.5;
      padding: 40px 0;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    /* BUTTONS */
    .btn {
      background: none;
      border: 2px solid var(--cyan);
      color: var(--cyan);
      cursor: pointer;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .btn:hover { background: var(--cyan); color: var(--pink); }

    /* ARROW BUTTONS */
    .arrow-btn {
      background: none;
      border: 2px solid var(--cyan);
      color: var(--cyan);
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .arrow-btn:hover:not(:disabled) { background: var(--cyan); color: var(--pink); }
    .arrow-btn:disabled { opacity: 0.25; cursor: default; }
    .arrow-btn svg { width: 18px; height: 18px; }

    .page-label {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--cyan);
      letter-spacing: 1px;
    }

    /* LIGHTBOX */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #lightbox.open { display: flex; }

    .lb-img-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      overflow: hidden;
    }
    #lb-img {
      max-width: 100%;
      max-height: calc(100vh - 120px);
      object-fit: contain;
      display: block;
    }

    .lb-bar {
      height: 52px;
      background: var(--pink);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      flex-shrink: 0;
    }

    .lb-counter {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--cyan);
      letter-spacing: 1px;
      min-width: 60px;
      text-align: center;
    }

    .lb-close {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: 2px solid var(--cyan);
      color: var(--cyan);
      cursor: pointer;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      z-index: 101;
    }
    .lb-close:hover { background: var(--cyan); color: var(--pink); }
  </style>
</head>
<body>

<div class="bar bar-top">
  <span class="site-title">MY SITE</span>
</div>

<main class="main">

  <!-- FOLDER GRID -->
  <div id="grid-view">
    <div class="folder-grid" id="folder-grid"></div>
  </div>

  <!-- PHOTOS INSIDE A FOLDER -->
  <div id="folder-view">
    <div class="folder-nav">
      <button class="btn" id="back-btn">← Back</button>
      <span class="folder-view-title" id="folder-view-title"></span>
    </div>
    <div class="photo-grid" id="photo-grid"></div>
  </div>

</main>

<div class="bar bar-bottom">
  <button class="arrow-btn" id="prev-btn" aria-label="Previous page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <span class="page-label" id="page-label">1 / 1</span>
  <button class="arrow-btn" id="next-btn" aria-label="Next page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button class="lb-close" id="lb-close">✕ Close</button>
  <div class="lb-img-wrap">
    <img id="lb-img" src="" alt="" />
  </div>
  <div class="lb-bar">
    <button class="arrow-btn" id="lb-prev" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="lb-counter" id="lb-counter">1 / 1</span>
    <button class="arrow-btn" id="lb-next" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
</div>

<script>
  const PER_PAGE = 4;
  let folders = [];
  let page = 0;
  let activeFolder = null;
  let lbIndex = 0;

  const gridView       = document.getElementById('grid-view');
  const folderView     = document.getElementById('folder-view');
  const folderGrid     = document.getElementById('folder-grid');
  const photoGrid      = document.getElementById('photo-grid');
  const folderViewTitle= document.getElementById('folder-view-title');
  const pageLabel      = document.getElementById('page-label');
  const prevBtn        = document.getElementById('prev-btn');
  const nextBtn        = document.getElementById('next-btn');
  const backBtn        = document.getElementById('back-btn');
  const lightbox       = document.getElementById('lightbox');
  const lbImg          = document.getElementById('lb-img');
  const lbCounter      = document.getElementById('lb-counter');
  const lbPrev         = document.getElementById('lb-prev');
  const lbNext         = document.getElementById('lb-next');
  const lbClose        = document.getElementById('lb-close');

  async function init() {
    try {
      const r = await fetch('data.json?t=' + Date.now());
      const d = await r.json();
      folders = d.folders || [];
    } catch(e) { folders = []; }
    renderGrid();
  }

  function totalPages() { return Math.max(1, Math.ceil(folders.length / PER_PAGE)); }

  function renderGrid() {
    const tp = totalPages();
    page = Math.min(page, tp - 1);
    const slice = folders.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE);

    folderGrid.innerHTML = '';
    slice.forEach((f, i) => {
      const card = document.createElement('div');
      card.className = 'folder-card';
      card.tabIndex = 0;

      if (f.thumbnail) {
        card.innerHTML = `<img class="folder-thumb" src="${f.thumbnail}" alt="${f.title}" loading="lazy">
                          <div class="folder-name">${f.title}</div>`;
      } else {
        card.innerHTML = `<div class="folder-thumb-empty">📁</div>
                          <div class="folder-name">${f.title}</div>`;
      }

      const idx = page * PER_PAGE + i;
      card.addEventListener('click', () => openFolder(idx));
      card.addEventListener('keydown', e => { if (e.key === 'Enter') openFolder(idx); });
      folderGrid.appendChild(card);
    });

    pageLabel.textContent = `${page + 1} / ${tp}`;
    prevBtn.disabled = page === 0;
    nextBtn.disabled = page >= tp - 1;
  }

  function openFolder(idx) {
    activeFolder = folders[idx];
    folderViewTitle.textContent = activeFolder.title;
    photoGrid.innerHTML = '';

    if (!activeFolder.photos || activeFolder.photos.length === 0) {
      photoGrid.innerHTML = '<div class="empty-msg">No photos yet. Add them to data.json.</div>';
    } else {
      activeFolder.photos.forEach((src, i) => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.tabIndex = 0;
        const img = document.createElement('img');
        img.src = src;
        img.alt = `Photo ${i + 1}`;
        img.loading = 'lazy';
        card.appendChild(img);
        card.addEventListener('click', () => openLightbox(i));
        card.addEventListener('keydown', e => { if (e.key === 'Enter') openLightbox(i); });
        photoGrid.appendChild(card);
      });
    }

    gridView.style.display = 'none';
    folderView.style.display = 'block';
    prevBtn.style.visibility = 'hidden';
    nextBtn.style.visibility = 'hidden';
    pageLabel.style.visibility = 'hidden';
  }

  backBtn.addEventListener('click', () => {
    folderView.style.display = 'none';
    gridView.style.display = 'block';
    prevBtn.style.visibility = '';
    nextBtn.style.visibility = '';
    pageLabel.style.visibility = '';
  });

  prevBtn.addEventListener('click', () => { if (page > 0) { page--; renderGrid(); } });
  nextBtn.addEventListener('click', () => { if (page < totalPages() - 1) { page++; renderGrid(); } });

  function openLightbox(i) {
    lbIndex = i;
    updateLb();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function updateLb() {
    const photos = activeFolder.photos;
    lbImg.src = photos[lbIndex];
    lbCounter.textContent = `${lbIndex + 1} / ${photos.length}`;
    lbPrev.disabled = lbIndex === 0;
    lbNext.disabled = lbIndex === photos.length - 1;
  }

  function closeLb() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  lbPrev.addEventListener('click', () => { if (lbIndex > 0) { lbIndex--; updateLb(); } });
  lbNext.addEventListener('click', () => { if (lbIndex < activeFolder.photos.length - 1) { lbIndex++; updateLb(); } });
  lbClose.addEventListener('click', closeLb);
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLb(); });

  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'ArrowLeft' && lbIndex > 0) { lbIndex--; updateLb(); }
    if (e.key === 'ArrowRight' && lbIndex < activeFolder.photos.length - 1) { lbIndex++; updateLb(); }
    if (e.key === 'Escape') closeLb();
  });

  init();
</script>
</body>
</html>
